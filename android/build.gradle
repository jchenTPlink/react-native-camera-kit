apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 30 // Updated to match a more recent compileSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "x86"
        }
    }
    lintOptions {
        warning 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+' // Keep dynamic dependency if intentional
    implementation 'com.google.zxing:core:3.3.3'
    implementation 'com.drewnoakes:metadata-extractor:2.12.0'
    implementation "androidx.core:core-ktx:1.6.0" // Downgrade to avoid issues with latest alpha versions
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "androidx.camera:camera-core:1.0.0"
    implementation "androidx.camera:camera-camera2:1.0.0"
    implementation "androidx.camera:camera-lifecycle:1.0.0"
    implementation "androidx.camera:camera-view:1.0.0-alpha20"

    implementation 'com.google.mlkit:barcode-scanning:16.0.3'
}

repositories {
    mavenCentral()
}
